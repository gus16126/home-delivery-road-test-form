  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="24"/>
  <circle cx="256" cy="256" r="30" fill="#ffffff"/>
  <!-- Spokes -->
  <line x1="256" y1="140" x2="256" y2="226" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="140" y1="256" x2="226" y2="256" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="372" y1="256" x2="286" y2="256" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="256" y1="286" x2="256" y2="372" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <!-- Checkmark badge at bottom right -->
  <circle cx="380" cy="380" r="70" fill="#34c759" stroke="#ffffff" stroke-width="12"/>
  <path d="M345 380 l23 23 l45 -45" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
